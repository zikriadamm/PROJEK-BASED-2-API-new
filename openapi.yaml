      parameters:
        - name: activityId
          in: query
          required: false
          description: Filter pengeluaran berdasarkan ID kegiatan riset.
          schema:
            type: integer
            minimum: 1
        - name: category
          in: query
          required: false
          description: Filter pengeluaran berdasarkan kategori.
          schema:
            type: string
            enum:
              - akomodasi
              - transportasi
              - konsumsi
              - belanja
              - hiburan
